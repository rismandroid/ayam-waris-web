/* Layout: gaya keluarga Ayam Kas — latar krem, kartu putih membulat, kartu saldo gradasi mint→peach dengan maskot,
   navigasi bawah mengambang dengan tombol + hijau di tengah, lembar bawah untuk aksi. Satu tema terang (identitas merek). */
:root{
  color-scheme:light;
  --bg:#FFF8F0; --card:#FFFFFF; --ink:#262626; --ink-2:#4A4A4A; --muted:#8A847C; --line:#EFE7DC; --line-2:#E4DACB;
  --green:#1C7A5E; --green-2:#14624B; --green-tint:#E3F4EC; --green-text:#1C7A5E;
  --orange:#E8794A; --orange-tint:#FDE9DF;
  --yellow-tint:#FFF1C9; --yellow-ink:#5B4300; --gold:#F7C734;
  --blue-tint:#E3EFFB; --blue-ink:#2F6EB0;
  --pink:#FF8C8C; --mint:#BFE6D2; --sky:#BCD4F5; --peach:#F8BAA8;
  --s1:#1C7A5E; --s2:#E8794A; --s3:#4C8FD6; --s4:#E2A21B; --s5:#E36F86; --s6:#3FA88A; --s7:#8D6CC4; --s8:#B98A55;
  --shadow:0 2px 10px rgba(120,90,40,.07);
  --font:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-ar:"Amiri","Traditional Arabic",serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto}

/* Header seperti "Halo, …" di Ayam Kas */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg)}
.top .row{display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.avatar{width:46px;height:46px;border-radius:14px;background:var(--yellow-tint);display:grid;place-items:center;flex:none;overflow:hidden}
.avatar svg{width:52px;height:50px;margin:6px 0 0 4px}
.top h1{margin:0;font-size:20px;font-weight:900;letter-spacing:-.01em;line-height:1.15;display:flex;gap:6px;align-items:baseline;white-space:nowrap;min-width:0}
.top h1 .ar{font-family:var(--font-ar);font-size:17px;color:var(--muted);font-weight:700}
.top .sub{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:800;background:var(--green-tint);color:var(--green-text);border:0;cursor:pointer}
@media (max-width:420px){.top .sub > span:first-child{display:none}}
.top .row > div:nth-child(2){flex:1;min-width:0;overflow:hidden}
.top h1 .ar{flex:0 1 auto;min-width:0;overflow:hidden;white-space:nowrap}
.top .chip{white-space:nowrap}
.step{overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){.top .row{gap:9px}.avatar{width:40px;height:40px;border-radius:12px}.avatar svg{width:46px;height:44px}.iconbtn{width:36px;height:36px;border-radius:11px}.top h1{font-size:18px}.step{font-size:12px}}
.iconbtn{margin-left:auto;width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:var(--shadow)}
.iconbtn svg{width:20px;height:20px;color:var(--ink-2)}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-bottom:10px}
.step{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 2px;font-size:12.5px;font-weight:800;color:var(--muted);cursor:pointer;min-width:0;white-space:nowrap}
@media (max-width:420px){.step b{display:none!important}}
.step b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--line);color:var(--ink-2);font-size:11px;margin-right:4px}
.step[aria-current="step"]{background:var(--green);border-color:var(--green);color:#fff}
.step[aria-current="step"] b{background:rgba(255,255,255,.25);color:#fff}
.step.done b{background:var(--green-tint);color:var(--green)}

main{display:flex;flex-direction:column;gap:12px;padding-block:6px calc(120px + env(safe-area-inset-bottom,0px))}
#main{min-width:0;width:100%}
.sec{margin:10px 2px -2px;font-size:16px;font-weight:900;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec a,.sec button.link{font-size:13px;font-weight:800;color:var(--green);background:none;border:0;cursor:pointer;padding:0;text-decoration:none}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-size:16px;font-weight:900}
.hint{color:var(--muted);font-size:13px;margin:0}
.info{background:var(--blue-tint);color:var(--blue-ink);border-radius:14px;padding:11px 13px;font-size:13.5px;font-weight:600;display:flex;gap:8px}
.info .i{flex:none;width:18px;height:18px;border-radius:5px;background:var(--blue-ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900;margin-top:1px}

/* Kartu saldo → kartu harta waris */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 16px;background:linear-gradient(115deg,#DDF2E8 0%,#E8F1EA 45%,#FBE3D6 100%);min-height:156px;display:flex;flex-direction:column;gap:4px}
.hero::before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:#D6E6F8;right:62px;top:-50px;opacity:.9}
.hero .lbl{position:relative;font-size:13.5px;font-weight:800;color:var(--ink-2)}
.hero .big{position:relative;font-size:clamp(24px,7.2vw,32px);font-weight:900;letter-spacing:-.02em;line-height:1.15;white-space:nowrap}
.hero .meta{position:relative;font-size:13px;color:var(--ink-2);font-weight:600;max-width:64%}
.hero .m{position:absolute;right:-6px;bottom:-4px;width:106px;height:101px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;min-width:0}
.stat .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.stat .ic svg{width:18px;height:18px}
.stat small{display:block;font-size:11.5px;line-height:1.25;color:var(--muted);font-weight:700}
.stat b{display:block;font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.in .ic{background:var(--green-tint);color:var(--green)} .stat.in b{color:var(--green)}
.stat.out .ic{background:var(--orange-tint);color:var(--orange)} .stat.out b{color:var(--orange)}

.tile{display:flex;align-items:center;gap:12px;border-radius:18px;padding:13px 14px;border:0;width:100%;text-align:left;cursor:pointer;text-decoration:none;color:inherit}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:20px}
.tile .t{font-weight:900;font-size:14.5px;display:block}
.tile .d{font-size:12.5px;color:var(--ink-2);display:block}
.tile .chev{margin-left:auto;font-weight:900;color:var(--ink-2);font-size:18px}
.tile.yellow{background:var(--yellow-tint)} .tile.yellow .ic{background:#fff}
.tile.wa{background:var(--green-tint)} .tile.wa .ic{background:var(--green);color:#fff}
.tile.wa .ic svg{width:22px;height:22px}

/* Form gaya "Ajukan setoran" */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1.5px solid var(--line-2);background:var(--card);border-radius:14px;padding:12px;font-weight:800;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--green-tint);border-color:var(--green);color:var(--green)}
label.f{display:flex;flex-direction:column;gap:7px;font-size:14px;font-weight:800}
label.f small{font-weight:600;color:var(--muted);font-size:12.5px;margin-top:-4px}
.inp{display:flex;align-items:center;border:1.5px solid var(--line-2);border-radius:14px;background:var(--card)}
.inp:focus-within{border-color:var(--green)}
.inp span{padding-left:14px;color:var(--muted);font-weight:800}
.inp input{border:0;outline:0;background:transparent;padding:13px 14px 13px 6px;width:100%;min-width:0;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.inp input::placeholder,input.txt::placeholder{color:#B3ABA0;font-weight:600}
input.txt{border:1.5px solid var(--line-2);border-radius:14px;background:var(--card);padding:13px 14px;font-size:16px;font-weight:700;width:100%}
input.txt:focus{border-color:var(--green);outline:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.check input{width:20px;height:20px;accent-color:var(--green);margin-top:1px;flex:none}
.btn{border:0;border-radius:16px;padding:14px 16px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:15.5px}
.btn.primary{background:var(--green);color:#fff;width:100%}
.btn.soft{background:var(--card);color:var(--ink);border:1.5px solid var(--line-2)}
.btn.small{padding:8px 12px;font-size:13px;border-radius:12px}
.actions{display:flex;gap:10px}
.actions .btn{flex:1}

/* Baris ahli waris & anggota */
.row{display:flex;align-items:center;gap:12px;padding-block:11px;border-top:1px solid var(--line)}
.rows > .row:first-child{border-top:0;padding-top:2px}
.who{flex:1;min-width:0}
.who .nm{font-weight:800;font-size:14.5px}
.who .st{font-size:12.5px;margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--ink-2);font-weight:600}
.pill{display:inline-flex;border-radius:999px;padding:0 8px;font-size:11.5px;font-weight:900;line-height:19px}
.pill.ok{background:var(--green-tint);color:var(--green)}
.pill.no{background:var(--orange-tint);color:#C2522A}
.pill.zero{background:var(--line);color:var(--ink-2)}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper button{width:36px;height:36px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--card);font-size:20px;font-weight:900;cursor:pointer;color:var(--green);line-height:1}
.stepper button:disabled{color:var(--line-2);cursor:default}
.stepper output{width:28px;text-align:center;font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}
.toggle{flex:none;border:1.5px solid var(--line-2);border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px;background:var(--card);color:var(--muted);cursor:pointer;min-width:92px}
.toggle[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}

.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;flex:none;position:relative}
.share{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}

<script>
/* Mesin hitung waris Islam (faraidh) Ayam Waris — © 2026 rismandroid
 * Pendapat jumhur (Syafi'i; kakek bersama saudara menurut Zaid bin Tsabit),
 * dengan mode "khi" untuk praktik Pengadilan Agama Indonesia.
 */
(function (root) {
  'use strict';

  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a || 1; }
  function lcm(a, b) { return a / gcd(a, b) * b; }

  class Fr {
    constructor(n, d = 1) {
      if (d < 0) { n = -n; d = -d; }
      const g = gcd(n, d); this.n = n / g; this.d = d / g;
      if (this.n === 0) this.d = 1;
    }
    add(o) { return new Fr(this.n * o.d + o.n * this.d, this.d * o.d); }
    sub(o) { return new Fr(this.n * o.d - o.n * this.d, this.d * o.d); }
    mul(o) { return new Fr(this.n * o.n, this.d * o.d); }
    div(o) { return new Fr(this.n * o.d, this.d * o.n); }
    cmp(o) { return this.n * o.d - o.n * this.d; }
    get zero() { return this.n === 0; }
    val() { return this.n / this.d; }
    toString() { return this.d === 1 ? String(this.n) : this.n + '/' + this.d; }
  }
  const F = (n, d) => new Fr(n, d);
  const ZERO = F(0), ONE = F(1);
  const fmax = (...xs) => xs.reduce((a, b) => (b.cmp(a) > 0 ? b : a));
  const fmin = (a, b) => (a.cmp(b) <= 0 ? a : b);

  // Urutan tampilan + label. sex: L / P. pair = pasangan ashabah bil ghair.
  const HEIRS = [
    { k: 'suami', label: 'Suami', sex: 'L', max: 1, grup: 'Pasangan' },
    { k: 'istri', label: 'Istri', sex: 'P', max: 4, grup: 'Pasangan' },
    { k: 'ayah', label: 'Ayah', sex: 'L', max: 1, grup: 'Orang tua & kakek-nenek' },
    { k: 'ibu', label: 'Ibu', sex: 'P', max: 1, grup: 'Orang tua & kakek-nenek' },
    { k: 'kakek', label: 'Kakek (ayah dari ayah)', sex: 'L', max: 1, grup: 'Orang tua & kakek-nenek' },
    { k: 'nenekIbu', label: 'Nenek (ibu dari ibu)', sex: 'P', max: 1, grup: 'Orang tua & kakek-nenek' },
    { k: 'nenekAyah', label: 'Nenek (ibu dari ayah)', sex: 'P', max: 1, grup: 'Orang tua & kakek-nenek' },
    { k: 'anakLk', label: 'Anak laki-laki', sex: 'L', max: 30, grup: 'Anak & cucu' },
    { k: 'anakPr', label: 'Anak perempuan', sex: 'P', max: 30, grup: 'Anak & cucu' },
    { k: 'cucuLk', label: 'Cucu laki-laki (dari anak laki-laki)', sex: 'L', max: 30, grup: 'Anak & cucu' },
    { k: 'cucuPr', label: 'Cucu perempuan (dari anak laki-laki)', sex: 'P', max: 30, grup: 'Anak & cucu' },
    { k: 'sdrLkKandung', label: 'Saudara laki-laki sekandung', sex: 'L', max: 30, grup: 'Saudara' },
    { k: 'sdrPrKandung', label: 'Saudara perempuan sekandung', sex: 'P', max: 30, grup: 'Saudara' },
    { k: 'sdrLkSeayah', label: 'Saudara laki-laki seayah', sex: 'L', max: 30, grup: 'Saudara' },
    { k: 'sdrPrSeayah', label: 'Saudara perempuan seayah', sex: 'P', max: 30, grup: 'Saudara' },
    { k: 'sdrLkSeibu', label: 'Saudara laki-laki seibu', sex: 'L', max: 30, grup: 'Saudara' },
    { k: 'sdrPrSeibu', label: 'Saudara perempuan seibu', sex: 'P', max: 30, grup: 'Saudara' },
    { k: 'kepLkKandung', label: 'Keponakan laki-laki (anak sdr. lk. sekandung)', sex: 'L', max: 30, grup: 'Kerabat jauh' },
    { k: 'kepLkSeayah', label: 'Keponakan laki-laki (anak sdr. lk. seayah)', sex: 'L', max: 30, grup: 'Kerabat jauh' },
    { k: 'pamanKandung', label: 'Paman sekandung (saudara kandung ayah)', sex: 'L', max: 30, grup: 'Kerabat jauh' },
    { k: 'pamanSeayah', label: 'Paman seayah (saudara seayah dari ayah)', sex: 'L', max: 30, grup: 'Kerabat jauh' },
    { k: 'sepupuKandung', label: 'Sepupu laki-laki (anak paman sekandung)', sex: 'L', max: 30, grup: 'Kerabat jauh' },
    { k: 'sepupuSeayah', label: 'Sepupu laki-laki (anak paman seayah)', sex: 'L', max: 30, grup: 'Kerabat jauh' },
  ];
  const LABEL = Object.fromEntries(HEIRS.map(h => [h.k, h.label]));

  /**
   * hitung(counts, opt) → pembagian dalam pecahan.
   * counts: { suami:0/1, istri:0-4, ayah:0/1, ... }
   * opt.mode: 'jumhur' (default) | 'khi'
   */
  function hitung(counts, opt = {}) {
    const khi = opt.mode === 'khi';
    const c = {}; HEIRS.forEach(h => { c[h.k] = Math.max(0, Math.min(h.max, Math.floor(+counts[h.k] || 0))); });
    if (c.suami && c.istri) throw new Error('Pilih suami ATAU istri, tidak keduanya.');

    const r = {};          // k -> { status, reason, basis, total:Fr, per:Fr }
    const notes = [];
    const kasus = [];
    const fixed = {};      // k -> Fr (bagian pasti, total kelompok)
    const basis = {};      // k -> teks dasar bagian
    let ashabah = null;    // { members:[{k,w}], label }
    const block = (k, by) => { if (c[k] > 0 && !r[k]) r[k] = { status: 'terhalang', reason: by, basis: 'Terhalang (mahjub)', total: ZERO, per: ZERO }; };

    let S = c.anakLk, D = c.anakPr, SS = c.cucuLk, SD = c.cucuPr;
    let FA = c.ayah, MO = c.ibu, GF = c.kakek, GMm = c.nenekIbu, GMp = c.nenekAyah;
    let FB = c.sdrLkKandung, FS = c.sdrPrKandung, PB = c.sdrLkSeayah, PS = c.sdrPrSeayah, MB = c.sdrLkSeibu, MS = c.sdrPrSeibu;
    const sibAll = FB + FS + PB + PS + MB + MS; // saudara yang terhalang pun tetap mengurangi bagian ibu (jumhur)

    // ---- Hijab keturunan & leluhur
    if (S) { block('cucuLk', 'anak laki-laki'); block('cucuPr', 'anak laki-laki'); SS = 0; SD = 0; }
    else if (D >= 2 && !SS && SD) { block('cucuPr', '2 anak perempuan atau lebih (jatah 2/3 sudah penuh)'); SD = 0; }
    if (FA && GF) { block('kakek', 'ayah'); GF = 0; }
    if (MO) { block('nenekIbu', 'ibu'); block('nenekAyah', 'ibu'); GMm = 0; GMp = 0; }
    if (FA && GMp) { block('nenekAyah', 'ayah'); GMp = 0; }

    const fw = S + D + SS + SD > 0;
    const maleDesc = S + SS > 0;
    const femDesc = D + SD > 0;

    // ---- Saudara seibu
    const matBy = fw ? 'anak/cucu pewaris' : FA ? 'ayah' : GF ? 'kakek' : null;
    if (matBy) { block('sdrLkSeibu', matBy); block('sdrPrSeibu', matBy); MB = 0; MS = 0; }

    // ---- Saudara sekandung/seayah
    const sibBy = S ? 'anak laki-laki' : SS ? 'cucu laki-laki' : FA ? 'ayah'
      : (khi && femDesc) ? 'anak perempuan (praktik KHI / yurisprudensi MA)' : null;
    if (sibBy) { ['sdrLkKandung', 'sdrPrKandung', 'sdrLkSeayah', 'sdrPrSeayah'].forEach(k => block(k, sibBy)); FB = FS = PB = PS = 0; }

    // ---- Pasangan
    if (c.suami) { fixed.suami = fw ? F(1, 4) : F(1, 2); basis.suami = fw ? '1/4 (ada anak/cucu)' : '1/2 (tidak ada anak/cucu)'; }
    if (c.istri) { fixed.istri = fw ? F(1, 8) : F(1, 4); basis.istri = (fw ? '1/8 (ada anak/cucu)' : '1/4 (tidak ada anak/cucu)') + (c.istri > 1 ? ', dibagi rata' : ''); }
    const spouseKey = c.suami ? 'suami' : c.istri ? 'istri' : null;
    const spouseShare = spouseKey ? fixed[spouseKey] : ZERO;

    // ---- Ibu
    if (MO) {
      const gharrawain = FA && spouseKey && !fw && sibAll < 2;
      if (gharrawain) {
        fixed.ibu = ONE.sub(spouseShare).mul(F(1, 3)); basis.ibu = '1/3 dari sisa (gharrawain)';
        kasus.push('Gharrawain (Umariyatain)');
      } else if (fw || sibAll >= 2) {
        fixed.ibu = F(1, 6); basis.ibu = fw ? '1/6 (ada anak/cucu)' : '1/6 (ada 2 saudara atau lebih)';
      } else { fixed.ibu = F(1, 3); basis.ibu = '1/3'; }
    }
    // ---- Nenek
    const gms = (GMm ? 1 : 0) + (GMp ? 1 : 0);
    if (gms) {
      if (GMm) { fixed.nenekIbu = F(1, 6 * gms); basis.nenekIbu = gms > 1 ? '1/6 dibagi dua nenek' : '1/6'; }
      if (GMp) { fixed.nenekAyah = F(1, 6 * gms); basis.nenekAyah = gms > 1 ? '1/6 dibagi dua nenek' : '1/6'; }
    }

    // ---- Anak & cucu
    if (S) {
      ashabah = { members: [{ k: 'anakLk', w: 2 }, { k: 'anakPr', w: 1 }], label: D ? 'Ashabah bil ghair (lk 2 : pr 1)' : 'Ashabah (sisa)', rank: 1 };
    } else {
      if (D) { fixed.anakPr = D === 1 ? F(1, 2) : F(2, 3); basis.anakPr = D === 1 ? '1/2 (seorang)' : '2/3 (dua orang atau lebih)'; }
      if (SS) {
        ashabah = { members: [{ k: 'cucuLk', w: 2 }, { k: 'cucuPr', w: 1 }], label: SD ? 'Ashabah bil ghair (lk 2 : pr 1)' : 'Ashabah (sisa)', rank: 2 };
      } else if (SD) {
        if (!D) { fixed.cucuPr = SD === 1 ? F(1, 2) : F(2, 3); basis.cucuPr = SD === 1 ? '1/2' : '2/3'; }
        else if (D === 1) { fixed.cucuPr = F(1, 6); basis.cucuPr = '1/6 (penyempurna 2/3)'; }
      }
    }

    // ---- Ayah
    let fatherAshabah = false;
    if (FA) {
      if (maleDesc) { fixed.ayah = F(1, 6); basis.ayah = '1/6 (ada anak/cucu laki-laki)'; }
      else if (femDesc) { fixed.ayah = F(1, 6); basis.ayah = '1/6 + sisa'; fatherAshabah = true; }
      else { basis.ayah = 'Ashabah (sisa)'; fatherAshabah = true; }
      if (fatherAshabah && !ashabah) ashabah = { members: [{ k: 'ayah', w: 1 }], label: basis.ayah, rank: 3 };
    }

    // ---- Kakek
    let gfSpecial = false, gfAshabah = false;
    if (GF) {
      const sibsWithGF = !maleDesc && (FB + FS + PB + PS) > 0;
      if (maleDesc) { fixed.kakek = F(1, 6); basis.kakek = '1/6 (ada anak/cucu laki-laki)'; }
      else if (sibsWithGF) { gfSpecial = true; }
      else {
        if (femDesc) { fixed.kakek = F(1, 6); basis.kakek = '1/6 + sisa'; } else basis.kakek = 'Ashabah (sisa)';
        gfAshabah = true;
        if (!ashabah) ashabah = { members: [{ k: 'kakek', w: 1 }], label: basis.kakek, rank: 4 };
      }
    }

    // ---- Saudara seibu
    const mat = MB + MS;
    if (mat) {
      const tot = mat === 1 ? F(1, 6) : F(1, 3);
      if (MB) { fixed.sdrLkSeibu = tot.mul(F(MB, mat)); basis.sdrLkSeibu = (mat === 1 ? '1/6' : '1/3 dibagi sama rata') ; }
      if (MS) { fixed.sdrPrSeibu = tot.mul(F(MS, mat)); basis.sdrPrSeibu = (mat === 1 ? '1/6' : '1/3 dibagi sama rata'); }
    }

    // ---- Saudara sekandung & seayah (tanpa kakek)
    let sibRank = null; // 5 = level sekandung, 6 = level seayah (sebagai ashabah)
    if (!gfSpecial && (FB + FS + PB + PS) > 0) {
      if (FB) {
        if (!ashabah) ashabah = { members: [{ k: 'sdrLkKandung', w: 2 }, { k: 'sdrPrKandung', w: 1 }], label: FS ? 'Ashabah bil ghair (lk 2 : pr 1)' : 'Ashabah (sisa)', rank: 5 };
        sibRank = 5;
      } else if (FS) {
        if (femDesc) {
          if (!ashabah) ashabah = { members: [{ k: 'sdrPrKandung', w: 1 }], label: "Ashabah ma'al ghair (bersama anak perempuan)", rank: 5 };
          sibRank = 5;
        } else { fixed.sdrPrKandung = FS === 1 ? F(1, 2) : F(2, 3); basis.sdrPrKandung = FS === 1 ? '1/2' : '2/3'; }
      }
      // seayah
      if (PB + PS) {
        if (FB) { block('sdrLkSeayah', 'saudara laki-laki sekandung'); block('sdrPrSeayah', 'saudara laki-laki sekandung'); }
        else if (FS && femDesc) { block('sdrLkSeayah', "saudara perempuan sekandung (ashabah ma'al ghair)"); block('sdrPrSeayah', "saudara perempuan sekandung (ashabah ma'al ghair)"); }
        else if (PB) {
          if (!ashabah) ashabah = { members: [{ k: 'sdrLkSeayah', w: 2 }, { k: 'sdrPrSeayah', w: 1 }], label: PS ? 'Ashabah bil ghair (lk 2 : pr 1)' : 'Ashabah (sisa)', rank: 6 };
          sibRank = sibRank || 6;
        } else if (PS) {
          if (FS === 1) { fixed.sdrPrSeayah = F(1, 6); basis.sdrPrSeayah = '1/6 (penyempurna 2/3)'; }
          else if (FS >= 2) block('sdrPrSeayah', '2 saudara perempuan sekandung (jatah 2/3 sudah penuh)');
          else if (femDesc) {
            if (!ashabah) ashabah = { members: [{ k: 'sdrPrSeayah', w: 1 }], label: "Ashabah ma'al ghair (bersama anak perempuan)", rank: 6 };
            sibRank = 6;
          } else { fixed.sdrPrSeayah = PS === 1 ? F(1, 2) : F(2, 3); basis.sdrPrSeayah = PS === 1 ? '1/2' : '2/3'; }
        }
      }
    }

    // ---- Kerabat jauh (ashabah bin nafsi) — terhalang oleh ashabah yang lebih dekat
    const far = [['kepLkKandung', 7], ['kepLkSeayah', 8], ['pamanKandung', 9], ['pamanSeayah', 10], ['sepupuKandung', 11], ['sepupuSeayah', 12]];
    const higher = [];
    if (S) higher.push([1, 'anak laki-laki']); if (SS) higher.push([2, 'cucu laki-laki']);
    if (FA) higher.push([3, 'ayah']); if (GF) higher.push([4, 'kakek']);
    if (sibRank === 5 || (gfSpecial && (FB || FS))) higher.push([5, FB ? 'saudara laki-laki sekandung' : 'saudara perempuan sekandung']);
    if (sibRank === 6 || (gfSpecial && !FB && !FS && (PB || PS))) higher.push([6, PB ? 'saudara laki-laki seayah' : 'saudara perempuan seayah']);
    if (khi && femDesc) higher.push([0, 'anak perempuan (praktik KHI / yurisprudensi MA)']);
    for (const [k, rank] of far) {
      if (!c[k] || r[k]) continue;
      const h = higher.filter(x => x[0] < rank).sort((a, b) => a[0] - b[0])[0];
      if (h) { block(k, h[1]); continue; }
      if (!ashabah) { ashabah = { members: [{ k, w: 1 }], label: 'Ashabah (sisa)', rank }; higher.push([rank, LABEL[k].toLowerCase()]); }
    }

    // ---- Kakek bersama saudara (Zaid bin Tsabit) dan Akdariyah
    let gfDone = false;
    if (gfSpecial) {
      const onlyOneSister = !FB && !PB && ((FS === 1 && PS === 0) || (FS === 0 && PS === 1));
      if (c.suami && MO && onlyOneSister && !fw) {
        // Akdariyah: 3/27 dll.
        kasus.push('Akdariyah');
        const sk = FS ? 'sdrPrKandung' : 'sdrPrSeayah';
        fixed.suami = F(9, 27); fixed.ibu = F(6, 27); fixed.kakek = F(8, 27); fixed[sk] = F(4, 27);
        basis.suami = '1/2 → 9/27 (akdariyah)'; basis.ibu = '1/3 → 6/27 (akdariyah)';
        basis.kakek = '1/6, digabung dengan saudari → 8/27'; basis[sk] = '1/2, digabung dengan kakek → 4/27';
        gfDone = true;
      } else {
        kasus.push('Kakek bersama saudara (muqasamah)');
        const others = Object.values(fixed).reduce((a, b) => a.add(b), ZERO);
        const R = ONE.sub(others);
        const sibKeys = ['sdrLkKandung', 'sdrPrKandung', 'sdrLkSeayah', 'sdrPrSeayah'];
        if (R.cmp(F(1, 6)) <= 0) {
          fixed.kakek = F(1, 6); basis.kakek = '1/6 (sisa tidak cukup)';
          sibKeys.forEach(k => { if (c[k] && !r[k]) r[k] = { status: 'habis', reason: 'sisa habis untuk kakek', basis: 'Bersama kakek', total: ZERO, per: ZERO }; });
        } else {
          const U = 2 + 2 * FB + FS + 2 * PB + PS;
          const muq = R.mul(F(2, U));
          const opts = others.zero ? [muq, F(1, 3)] : [muq, R.mul(F(1, 3)), F(1, 6)];
          const g = fmax(...opts);
          fixed.kakek = g;
          basis.kakek = g === muq ? 'Bagi rata dengan saudara (muqasamah)' : (g.cmp(F(1, 6)) === 0 && !others.zero && g === opts[2]) ? '1/6 harta (pilihan terbaik)' : (others.zero ? '1/3 harta (pilihan terbaik)' : '1/3 sisa (pilihan terbaik)');
          let rem = R.sub(g);
          const give = (k, val, b) => { fixed[k] = (fixed[k] || ZERO).add(val); basis[k] = b; };
          if (FB + FS) {
            if (!FB && FS && (PB + PS)) {
              const cap = FS === 1 ? F(1, 2) : F(2, 3);
              const t = fmin(rem, cap); give('sdrPrKandung', t, 'Bersama kakek, maksimal ' + cap);
              rem = rem.sub(t);
              const u = 2 * PB + PS;
              if (rem.n > 0) { if (PB) give('sdrLkSeayah', rem.mul(F(2 * PB, u)), 'Sisa bersama kakek'); if (PS) give('sdrPrSeayah', rem.mul(F(PS, u)), 'Sisa bersama kakek'); }
              else ['sdrLkSeayah', 'sdrPrSeayah'].forEach(k => { if (c[k]) r[k] = { status: 'habis', reason: 'dihitung untuk mengurangi bagian kakek (mu\'addah), lalu bagiannya kembali ke saudari sekandung', basis: "Mu'addah", total: ZERO, per: ZERO }; });
            } else {
              const u = 2 * FB + FS;
              if (FB) give('sdrLkKandung', rem.mul(F(2 * FB, u)), 'Bersama kakek (lk 2 : pr 1)');
              if (FS) give('sdrPrKandung', rem.mul(F(FS, u)), 'Bersama kakek (lk 2 : pr 1)');
              ['sdrLkSeayah', 'sdrPrSeayah'].forEach(k => { if (c[k]) r[k] = { status: 'terhalang', reason: "saudara sekandung (dihitung saat muqasamah/mu'addah, tetapi tidak menerima)", basis: "Mu'addah", total: ZERO, per: ZERO }; });
            }
          } else {
            const u = 2 * PB + PS;
            if (PB) give('sdrLkSeayah', rem.mul(F(2 * PB, u)), 'Bersama kakek (lk 2 : pr 1)');
            if (PS) give('sdrPrSeayah', rem.mul(F(PS, u)), 'Bersama kakek (lk 2 : pr 1)');
          }
          gfDone = true;
        }
      }
    }

    // ---- Penjumlahan, aul, ashabah, radd
    const amAwal = (() => {
      let m = 1; Object.values(fixed).forEach(f => { m = lcm(m, f.d); });
      return m;
    })();
    let sumFixed = Object.values(fixed).reduce((a, b) => a.add(b), ZERO);
    const totals = { ...fixed };
    let sisaTakTerbagi = ZERO;
    let status = 'adil';

    // Musyarakah (mazhab Syafi'i & Maliki)
    const isMusyarakah = c.suami && !fw && !FA && !GF && mat >= 2 && FB > 0 && (MO || gms) && sumFixed.cmp(ONE) >= 0 && ashabah && ashabah.rank === 5;
    if (isMusyarakah) {
      kasus.push('Musyarakah (Himariyyah)');
      const heads = mat + FB + FS;
      const third = F(1, 3);
      ['sdrLkSeibu', 'sdrPrSeibu', 'sdrLkKandung', 'sdrPrKandung'].forEach(k => {
        if (c[k] && !r[k]) { totals[k] = third.mul(F(c[k], heads)); basis[k] = '1/3 dibagi sama rata bersama saudara seibu (musyarakah)'; }
      });
      ashabah = null;
      notes.push("Musyarakah mengikuti mazhab Syafi'i dan Maliki. Menurut Hanafi dan Hanbali, saudara sekandung tidak mendapat bagian.");
    } else if (sumFixed.cmp(ONE) > 0) {
      status = 'aul';
      kasus.push('Aul');
      Object.keys(totals).forEach(k => { totals[k] = totals[k].div(sumFixed); });
      if (ashabah) ashabah.members.forEach(m => { if (c[m.k] && !totals[m.k]) r[m.k] = { status: 'habis', reason: 'harta habis untuk bagian pasti (aul)', basis: ashabah.label, total: ZERO, per: ZERO }; });
      ashabah = null;
    } else {
      const sisa = ONE.sub(sumFixed);
      if (ashabah) {
        const ms = ashabah.members.filter(m => c[m.k]);
        const units = ms.reduce((a, m) => a + m.w * c[m.k], 0);
        ms.forEach(m => {
          totals[m.k] = (totals[m.k] || ZERO).add(sisa.mul(F(m.w * c[m.k], units)));
          if (!(m.k === 'ayah' || m.k === 'kakek') || !fixed[m.k]) basis[m.k] = ashabah.label;
        });
        if (sisa.zero) ms.forEach(m => { if (!fixed[m.k]) r[m.k] = { status: 'habis', reason: 'tidak ada sisa setelah bagian pasti', basis: ashabah.label, total: ZERO, per: ZERO }; });
      } else if (!gfDone && sisa.n > 0) {
        const raddKeys = Object.keys(fixed).filter(k => k !== 'suami' && k !== 'istri');
        if (raddKeys.length) {
          status = 'radd'; kasus.push('Radd');
          const base = raddKeys.reduce((a, k) => a.add(fixed[k]), ZERO);
          raddKeys.forEach(k => { totals[k] = fixed[k].add(sisa.mul(fixed[k].div(base))); basis[k] += ' + radd'; });
        } else if (spouseKey && (khi || opt.raddPasangan)) {
          status = 'radd'; kasus.push('Radd kepada suami/istri');
          totals[spouseKey] = ONE; basis[spouseKey] += ' + radd (tidak ada ahli waris lain)';
          notes.push('Sisa diberikan kepada suami/istri karena tidak ada ahli waris lain (pendapat ulama belakangan dan praktik Pengadilan Agama).');
        } else {
          sisaTakTerbagi = sisa;
          notes.push(spouseKey
            ? 'Menurut jumhur klasik, sisa harta diberikan kepada dzawil arham (kerabat lain) atau baitul mal. Pilih mode KHI untuk memberikannya kepada suami/istri.'
            : 'Tidak ada ahli waris bagian pasti maupun ashabah. Harta diberikan kepada dzawil arham (kerabat lain) atau baitul mal.');
        }
      }
    }

    // ---- Susun hasil per jenis ahli waris
    const rows = [];
    let denom = 1;
    HEIRS.forEach(h => {
      const n = c[h.k]; if (!n) return;
      if (r[h.k]) { rows.push({ k: h.k, label: h.label, count: n, ...r[h.k] }); return; }
      const t = totals[h.k] || ZERO;
      const per = t.div(F(n));
      denom = lcm(denom, per.d);
      rows.push({ k: h.k, label: h.label, count: n, status: t.zero ? 'habis' : 'dapat', reason: '', basis: basis[h.k] || '', total: t, per });
    });
    if (sisaTakTerbagi.n) denom = lcm(denom, sisaTakTerbagi.d);
    rows.forEach(x => { x.saham = x.per.zero ? 0 : x.per.n * (denom / x.per.d); });

    if (khi) notes.push('Mode KHI: anak perempuan dianggap menghalangi saudara dan kerabat yang lebih jauh (yurisprudensi MA No. 86 K/AG/1994).');

    return { rows, kasus, notes, status, amAwal, denom, sisaTakTerbagi };
  }

  /** Hitung harta waris bersih dari harta kotor. Semua dalam rupiah. */
  function hartaBersih(h, adaPasangan) {
    const n = x => Math.max(0, +x || 0);
    const bersama = n(h.bersama), bawaan = n(h.bawaan);
    const gonoGini = h.gonoGini && adaPasangan ? Math.round(bersama / 2) : 0;
    const peninggalan = bersama - gonoGini + bawaan;
    const jenazah = n(h.jenazah), hutangAllah = n(h.hutangAllah), hutangManusia = n(h.hutangManusia);
    let sisa = peninggalan;
    const steps = [];
    steps.push({ label: 'Harta peninggalan almarhum', val: peninggalan, note: gonoGini ? 'setelah 1/2 harta bersama (gono-gini) diserahkan ke pasangan' : '' });
    const take = (label, amt) => { const used = Math.min(sisa, amt); sisa -= used; steps.push({ label, val: -used, short: amt - used }); return amt - used; };
    let kurang = 0;
    if (jenazah) kurang += take('Biaya perawatan jenazah', jenazah);
    if (hutangAllah) kurang += take('Hutang kepada Allah (zakat, nazar, haji, kafarat)', hutangAllah);
    if (hutangManusia) kurang += take('Hutang kepada manusia', hutangManusia);
    const setelahHutang = sisa;
    const wasiat = n(h.wasiat);
    const batas = Math.floor(setelahHutang / 3);
    const wasiatEfektif = h.wasiatSetuju ? Math.min(wasiat, setelahHutang) : Math.min(wasiat, batas);
    if (wasiat) steps.push({ label: 'Wasiat' + (wasiat > wasiatEfektif ? ' (dibatasi 1/3)' : ''), val: -wasiatEfektif });
    sisa -= wasiatEfektif;
    return { bersama, bawaan, gonoGini, peninggalan, steps, kurangBayar: kurang, setelahHutang, wasiat, batasWasiat: batas, wasiatEfektif, hartaWaris: sisa };
  }

  /** Bagikan rupiah per orang; sisa pembulatan dicatat. */
  function rupiah(res, harta) {
    let dibagi = 0;
    res.rows.forEach(x => {
      x.rpPer = Math.floor(harta * x.per.n / x.per.d);
      x.rpTotal = x.rpPer * x.count; dibagi += x.rpTotal;
    });
    const tak = res.sisaTakTerbagi.n ? Math.floor(harta * res.sisaTakTerbagi.n / res.sisaTakTerbagi.d) : 0;
    return { dibagi, takTerbagi: tak, pembulatan: harta - dibagi - tak };
  }

  const api = { Fr, hitung, hartaBersih, rupiah, HEIRS, LABEL };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.Waris = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

<script>
(function(){

const APP = 'Ayam Waris';
const VERSI = '1.6.1';
const UNDUH_URL = 'https://rismandro.id/#ayam-waris';
const UNDUH_LABEL = 'rismandro.id/#ayam-waris';
const PEMILIK = 'rismandroid';
const KONTAK_EMAIL = 'apps.rismandroid@gmail.com';
const ADA_EMAIL = /^[^\s@\[\]]+@[^\s@]+\.[^\s@]+$/.test(KONTAK_EMAIL);
const $ = s => document.querySelector(s);
const main = $('#main');

function fromContoh(c){ const s = fresh(); s.sex=c.sex; s.harta={...EMPTY_HARTA, gonoGini:false, ...c.m}; s.heirs={...c.h}; s.sample=c.t; return s; }

function compute(){
  const adaPasangan = S.sex === 'L' ? (S.heirs.istri||0) > 0 : (S.heirs.suami||0) > 0;
  const hb = Waris.hartaBersih(S.harta, adaPasangan);
  const counts = {...S.heirs};
  if (S.sex === 'L') counts.suami = 0; else counts.istri = 0;
  if (!Waris.HEIRS.some(h => (counts[h.k]||0) > 0)) return {hb, res:null};
  const res = Waris.hitung(counts, {mode:S.mode});
  const money = Waris.rupiah(res, hb.hartaWaris);
  return {hb, res, money};
}

function render(){
  document.querySelectorAll('nav.bottom .it').forEach(b => b.setAttribute('aria-current', b.dataset.tab === view.tab ? 'page' : 'false'));
  $('#steps').hidden = view.tab !== 'hitung';
  document.querySelectorAll('.step').forEach(b => { const n = +b.dataset.step; b.setAttribute('aria-current', n === view.step ? 'step' : 'false'); b.classList.toggle('done', n < view.step); });
  $('#modechip').textContent = S.mode === 'khi' ? 'Mode KHI' : 'Mode Jumhur';
  if (view.tab === 'hitung') main.innerHTML = sampleTile() + [null, stepAlmarhum, stepHarta, stepAhli, stepHasil][view.step]();
  else if (view.tab === 'contoh') main.innerHTML = pageContoh();

function stepAhli(){
  const {res} = compute();
  const byK = {}; if (res) res.rows.forEach(r => byK[r.k] = r);
  const groups = {};
  Waris.HEIRS.forEach(h => {
    if (S.sex==='L' && h.k==='suami') return;
    if (S.sex==='P' && h.k==='istri') return;
    (groups[h.grup] = groups[h.grup] || []).push(h);
  });
  const hint = {
    'Pasangan': S.sex==='L' ? "Istri sah saat almarhum wafat, termasuk yang masih dalam iddah talak raj'i." : 'Suami sah saat almarhumah wafat.',

    'Anak & cucu': 'Cucu hanya dari anak laki-laki. Anak angkat dan anak tiri tidak mewarisi.',

}
function heirRow(h, r){
  const n = S.heirs[h.k] || 0;
  let st = '';
  if (n && r) {
    if (r.status === 'terhalang') st = `<span class="pill no">Terhalang</span><span>oleh ${esc(r.reason)}</span>`;
    else if (r.status === 'habis') st = `<span class="pill zero">Tidak kebagian</span><span>${esc(r.reason)}</span>`;
    else st = `<span class="pill ok">${esc(r.total.toString())}</span><span>${esc(r.basis)}</span>`;
  }
  const ctl = h.max === 1
    ? `<button type="button" class="toggle" data-toggle="${h.k}" aria-pressed="${n>0}">${n>0?'Ada':'Tidak ada'}</button>`
    : `<div class="stepper" role="group" aria-label="Jumlah ${esc(h.label)}"><button type="button" data-dec="${h.k}" ${n?'':'disabled'} aria-label="Kurangi">−</button><output class="num">${n}</output><button type="button" data-inc="${h.k}" ${n>=h.max?'disabled':''} aria-label="Tambah">+</button></div>`;
  return `<div class="row"><div class="who"><div class="nm">${esc(h.label)}</div>${st?`<div class="st">${st}</div>`:''}</div>${ctl}</div>`;
}

function stepHasil(){
  const {hb, res, money: m} = compute();
  if (!res) return `<section class="card empty">${M('sleep')}<b>Belum ada ahli waris</b><p class="hint">Tambahkan ahli waris yang masih hidup saat almarhum wafat.</p><button class="btn primary" data-go="3" type="button">Isi ahli waris</button></section>`;
  const got = res.rows.filter(r => r.status === 'dapat');
  const off = res.rows.filter(r => r.status !== 'dapat');
  got.forEach((r,i) => { r.color = `var(${SERIES[i % SERIES.length]})`; r.tint = TINTS[i % TINTS.length]; });
  const sad = hb.kurangBayar > 0 || hb.hartaWaris === 0;
  const nOrang = got.reduce((a,r)=>a+r.count,0);
  const potong = hb.peninggalan - hb.hartaWaris;
  const kasus = [...new Set(res.kasus)];
  const pct = f => (f.val()*100).toLocaleString('id-ID',{maximumFractionDigits:1}) + '%';
  const shares = got.map(r => `<div class="share">
      <span class="av" style="background:${r.tint};color:${r.color}">${INI[r.k]}</span>
      <div style="min-width:0"><div class="nm">${esc(r.label)}${r.count>1?` <span class="num">× ${r.count}</span>`:''}</div><div class="bs">${esc(r.basis)}</div></div>
      <div class="rp">${rp(r.rpPer)}${r.count>1?`<small>per orang</small>`:''}</div>
      <div class="meter"><span class="track"><i style="width:${(r.total.val()*100).toFixed(2)}%;background:${r.color}"></i></span><span>${pct(r.total)}</span></div>
      <div class="fr">${r.count>1?`Total ${rp(r.rpTotal)} · `:''}${r.count>1?'per orang ':''}${r.per.toString()} · ${r.saham} dari ${res.denom} saham</div>

    try {
      await CAP.nativePromise('GaleriAyam', 'simpan', {data: png.split(',')[1], fileName: treeFileName()});
      toast('Tersimpan di Galeri › album Ayam Waris');
    } catch(e) { toast(e && e.code === 'DENIED' ? 'Izin penyimpanan ditolak' : 'Gagal menyimpan gambar'); }
  });
}
async function shareTree(btn){
  await busy(btn, async () => {
    let png;
    try { png = await treePng(); } catch(e) { toast(e.message || 'Gagal membuat gambar'); return; }
    const {hb, res} = compute();
    const caption = shareText(hb, res);
    if (isNative()) {
      try {
        const w = await CAP.nativePromise('Filesystem', 'writeFile', {path: 'pohon/' + treeFileName() + '.png', data: png.split(',')[1], directory: 'CACHE', recursive: true});
        await CAP.nativePromise('Share', 'share', {title: 'Pohon Waris', text: caption, files: [w.uri], dialogTitle: 'Bagikan pohon waris'});
      } catch(e) { const m = String(e && e.message || ''); if (!/cancel/i.test(m)) toast('Gagal membagikan gambar'); }
      return;
    }
    try {
      const blob = await (await fetch(png)).blob();
      const file = new File([blob], treeFileName() + '.png', {type: 'image/png'});
      if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: 'Pohon Waris', text: caption}); return; }
    } catch(e) { if (e && e.name === 'AbortError') return; }
    if (isWebApp()) { downloadPng(png, treeFileName()); toast('Browser ini tidak mendukung bagikan; gambar disimpan ke Download'); return; }
    previewSheet(png, 'Tekan lama gambar di atas untuk menyimpan atau membagikannya. Di aplikasi Android, tombol ini langsung membuka menu bagikan (WhatsApp, Telegram, dan lainnya).');
  });
}
function centerTree(){
  const b = document.querySelector('.treebox'); if (!b) return;
  const me = +b.dataset.me, svg = b.querySelector('svg');
  const off = Math.max(0, (b.clientWidth - svg.clientWidth) / 2);
  b.scrollLeft = Math.max(0, me + 16 + off - b.clientWidth / 2);
}
function shareText(hb, res){
  const L = [`*Pembagian Waris${S.nama?' — '+S.nama:''}*`, `Harta waris bersih: ${rp(hb.hartaWaris)}`, ''];
  res.rows.filter(r=>r.status==='dapat').forEach(r => L.push(`• ${r.label}${r.count>1?' ('+r.count+' orang)':''}: ${rp(r.rpPer)}${r.count>1?' per orang':''} [${r.basis}]`));
  const off = res.rows.filter(r=>r.status!=='dapat');
  if (off.length) { L.push(''); L.push('Tidak mendapat bagian:'); off.forEach(r => L.push(`• ${r.label} — ${r.status==='terhalang'?'terhalang oleh '+r.reason:r.reason}`)); }
  L.push(''); L.push(`Dihitung dengan ${APP} (${S.mode==='khi'?'KHI Indonesia':'jumhur ulama'}).`); L.push('Unduh Ayam Waris: ' + UNDUH_LABEL); L.push('© 2026 rismandroid');
  return L.join('\n');
}

function pageRiwayat(){
  const list = loadR();
  if (!list.length) return `<section class="card empty">${M('sleep')}<b>Belum ada riwayat</b><p class="hint">Hitungan yang Anda simpan muncul di sini. Tekan "Simpan ke riwayat" di halaman hasil.</p><button class="btn primary" type="button" data-go="4">Lihat hitungan saat ini</button></section>`;
  return `<div class="info"><span class="i">i</span><span>Riwayat tersimpan di HP ini saja dan tidak dikirim ke internet. Menghapus data aplikasi akan menghapus riwayat.</span></div>

function pageContoh(){

    Object.entries(groups).map(([g, list]) => `<div class="sec">${g}</div><section class="card"><div class="exlist">${list.map(([c,i]) => `<button class="ex" type="button" data-contoh="${i}"><span class="av" style="background:var(--yellow-tint);font-size:18px">${c.e}</span><span style="min-width:0"><span class="t">${esc(c.t)}</span><span class="d">${esc(c.d)}</span></span><span class="chev">›</span></button>`).join('')}</div></section>`).join('');
}
function pagePanduan(){
  const T = [
    ['Istri','1/8','ada anak/cucu'],['Istri','1/4','tidak ada anak/cucu'],['Suami','1/4','ada anak/cucu'],['Suami','1/2','tidak ada anak/cucu'],
    ['Ibu','1/6','ada anak/cucu, atau 2+ saudara'],['Ibu','1/3','selain itu'],['Ayah','1/6','ada anak/cucu laki-laki'],['Ayah','1/6 + sisa','hanya ada anak/cucu perempuan'],['Ayah','Sisa','tidak ada anak/cucu'],
    ['Anak lk + pr','Sisa, 2 : 1','—'],['Anak perempuan','1/2','seorang, tanpa anak laki-laki'],['Anak perempuan','2/3','dua atau lebih, tanpa anak laki-laki'],
    ['Nenek','1/6','tidak ada ibu'],['Saudara seibu','1/6 atau 1/3','tanpa anak, ayah, kakek'],['Saudari kandung','1/2 atau 2/3','tanpa anak laki-laki, ayah, saudara laki-laki']
  ];

      <ul class="notes"><li>Pisahkan gono-gini bila pasangan masih hidup.</li><li>Bayar biaya jenazah.</li><li>Lunasi hutang kepada Allah dan manusia.</li><li>Tunaikan wasiat, maksimal 1/3 dan bukan untuk ahli waris.</li><li>Sisanya dibagi kepada ahli waris.</li></ul></section>
    <div class="sec">Bagian yang paling sering</div><section class="card"><div class="tbl"><table><thead><tr><th>Ahli waris</th><th>Bagian</th><th>Syarat</th></tr></thead><tbody>${T.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div></section>

      <li><b>Ashabah</b>: penerima sisa setelah bagian pasti dibagikan.</li>

      <li><b>Aul</b>: jumlah bagian melebihi harta, semua dikurangi sebanding.</li>
      <li><b>Radd</b>: harta bersisa tanpa ashabah, sisa kembali ke ahli waris selain suami/istri.</li>
      <li><b>Asal masalah</b>: penyebut bersama untuk membagi harta menjadi saham.</li></ul></section>`;
}
/* ---------- Pasang sebagai aplikasi (PWA) ---------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (view.tab === 'tentang' || view.tab === 'hitung') keepScroll(render); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('Ayam Waris terpasang di layar utama'); keepScroll(render); });
function installCard(){
  if (!isWebApp() || isStandalone()) return '';
  if (installEvt) return `<button class="tile wa" type="button" data-act="install"><span class="ic">📲</span><span><span class="t">Pasang Ayam Waris</span><span class="d">Tambahkan ke layar utama, bisa dibuka tanpa internet</span></span><span class="chev">›</span></button>`;
  if (isIOS()) return `<button class="tile yellow" type="button" data-act="ioshelp"><span class="ic">📲</span><span><span class="t">Pasang di iPhone/iPad</span><span class="d">Ketuk untuk melihat caranya</span></span><span class="chev">›</span></button>`;
  return '';
}
function ajakText(){ return 'Assalamu\'alaikum. Ada aplikasi gratis untuk menghitung pembagian waris Islam (faraidh), lengkap dengan hutang, wasiat, dan pohon keluarga: Ayam Waris.\n\nUnduh di ' + UNDUH_URL; }
function pageTentang(){
  const email = ADA_EMAIL
    ? `<div class="row" style="border-top:0;padding-top:2px"><span class="av" style="background:var(--green-tint);color:var(--green)">✉️</span><div class="who"><div class="nm" style="word-break:break-all">${esc(KONTAK_EMAIL)}</div><div class="st">Pertanyaan, saran, atau laporan kesalahan hitungan</div></div></div>
       <div class="actions"><a class="btn primary" href="mailto:${esc(KONTAK_EMAIL)}?subject=${encodeURIComponent('Ayam Waris versi ' + VERSI)}">Kirim email</a><button class="btn soft" type="button" data-act="copymail">Salin alamat</button></div>`
    : `<p class="hint">Email kontak belum diisi.</p>`;
  return `<section class="card about">${M('wink')}
      <h2>${APP}</h2><p class="hint">Kalkulator waris Islam (faraidh) · versi ${VERSI}</p></section>
    <div class="sec">Apa itu Ayam Waris?</div><section class="card">
      <p style="margin:0;font-weight:600;color:var(--ink-2)">Ayam Waris membantu keluarga menghitung pembagian harta warisan sesuai hukum Islam. Cukup isi siapa yang wafat, harta dan hutangnya, serta ahli waris yang masih hidup. Ayam Waris menunjukkan bagian setiap orang, siapa yang terhalang, dan pohon keluarganya.</p>
      <p style="margin:0;font-weight:600;color:var(--ink-2)">Hitungan mengikuti QS An-Nisa ayat 11, 12, dan 176, hadits Nabi Muhammad ﷺ, pendapat jumhur ulama, serta Kompilasi Hukum Islam (KHI) yang dipakai Pengadilan Agama di Indonesia.</p>
      <p style="margin:0;font-weight:600;color:var(--ink-2)">Ayam Waris adalah anggota keluarga aplikasi <b>Ayam</b>, bersama <b>Ayam Kas</b> untuk buku kas keluarga yang transparan.</p></section>
    ${installCard()}
    <div class="sec">Unduh Ayam Waris</div><section class="card">
      <div class="row" style="border-top:0;padding-top:2px"><span class="av" style="background:var(--green-tint);color:var(--green)">📲</span><div class="who"><div class="nm" style="word-break:break-all">${UNDUH_LABEL}</div><div class="st">Unduh versi terbaru dan bagikan ke keluarga</div></div></div>
      <div class="actions"><a class="btn primary" href="${UNDUH_URL}" target="_blank" rel="noopener">Buka tautan</a><button class="btn soft" type="button" data-act="copylink">Salin tautan</button></div>
      <a class="tile wa" href="https://wa.me/?text=${encodeURIComponent(ajakText())}" target="_blank" rel="noopener"><span class="ic">${WA_ICON}</span><span><span class="t">Ajak keluarga pakai Ayam Waris</span><span class="d">Kirim tautan unduhan lewat WhatsApp</span></span><span class="chev">›</span></a></section>
    <div class="sec">Pemilik & kontak</div><section class="card">
      <div class="row" style="border-top:0;padding-top:2px"><span class="av" style="background:var(--yellow-tint);color:var(--yellow-ink)">R</span><div class="who"><div class="nm">${PEMILIK}</div><div class="st">Pembuat dan pengelola Ayam Waris</div></div></div>
      ${email}</section>
    <div class="sec">Privasi</div><section class="card"><ul class="notes">
      <li>Ayam Waris tidak memakai server dan tidak mengumpulkan data pribadi.</li>
      <li>Isian dan riwayat hitungan hanya tersimpan di HP Anda.</li>
      <li>Gambar pohon waris disimpan ke Galeri HP Anda, atau dikirim ke aplikasi yang Anda pilih sendiri.</li></ul></section>
    <div class="sec">Yang dihitung</div><section class="card"><ul class="notes">
      <li>23 jenis ahli waris, dari suami/istri sampai sepupu laki-laki.</li>
      <li>Hijab, ashabah, aul, radd, gharrawain, musyarakah, akdariyah, dan kakek bersama saudara.</li>
      <li>Gono-gini, biaya jenazah, hutang, dan batas wasiat 1/3.</li>
      <li>Dua dasar hukum: jumhur ulama dan praktik KHI di Pengadilan Agama.</li></ul></section>
    <div class="sec">Belum dihitung otomatis</div><section class="card"><ul class="notes">
      <li>Janin dalam kandungan, orang hilang, dan khuntsa: cadangkan bagian terbesar dulu.</li>
      <li>Ahli waris pengganti (KHI Pasal 185), dzawil arham, dan munasakhat.</li>
      <li>Wasiat wajibah untuk anak angkat atau kerabat non-muslim.</li></ul></section>
    <div class="sec">Hak cipta</div><section class="card"><ul class="notes">
      <li>Ayam Waris, termasuk kode program, tampilan, maskot ayam, nama, dan ikon, adalah ciptaan <b>${PEMILIK}</b> dan dilindungi Undang-Undang Nomor 28 Tahun 2014 tentang Hak Cipta.</li>
      <li>Boleh dipakai gratis untuk keperluan pribadi dan keluarga.</li>
      <li>Dilarang menjual, menyalin, mengubah, atau menyebarkan ulang dengan nama atau merek lain tanpa izin tertulis ${PEMILIK}.</li></ul>
      <p class="hint">Hasil Ayam Waris adalah panduan, bukan putusan hukum. Untuk kepastian hukum atau sengketa, hubungi Pengadilan Agama atau ahli faraidh.</p></section>`;
}

function sheet(title, body){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  $('#sheetHost').innerHTML = `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <span class="handle"></span>
    <div class="hd"><h2 id="sh-t">${title}</h2><button class="x" type="button" data-act="close" aria-label="Tutup">✕</button></div>${body}</div></div>`;
}
function openSheet(){
  sheet('🙌 Hitung waris baru', `<div class="info"><span class="i">i</span><span>Data yang sedang diisi akan dikosongkan. Hitungan yang sudah disimpan tetap ada di Riwayat.</span></div>
    <button class="btn primary" type="button" data-act="reset">Mulai dari kosong</button>
    <button class="btn soft" type="button" data-tab="contoh">Pilih dari contoh kasus</button>`);
}
function saveSheet(){
  const ada = S.rid && loadR().find(x => x.id === S.rid);
  const def = ada ? ada.judul : (S.nama ? 'Waris ' + S.nama : 'Hitungan ' + tgl(new Date().toISOString()));
  sheet('📜 Simpan ke riwayat', `<label class="f">Nama hitungan<input class="txt" id="judul" type="text" maxlength="80" value="${esc(def)}" autocomplete="off"></label>
    ${ada ? `<button class="btn primary" type="button" data-act="save" data-how="update">Perbarui hitungan ini</button><button class="btn soft" type="button" data-act="save" data-how="new">Simpan sebagai hitungan baru</button>`
          : `<button class="btn primary" type="button" data-act="save" data-how="new">Simpan</button>`}`);
}
function doSave(mode){
  const judul = (($('#judul')||{}).value || '').trim() || 'Hitungan tanpa nama';
  const list = loadR();
  const entry = {id: mode==='update' ? S.rid : 'r' + Date.now().toString(36), judul, waktu: new Date().toISOString(), data: snapshot(), ringkas: ringkas()};
  const i = list.findIndex(x => x.id === entry.id);
  if (i >= 0) list[i] = entry; else list.unshift(entry);
  if (!saveR(list)) { toast('Memori HP penuh atau tidak bisa diakses'); return; }
  S.rid = entry.id; S.sample = false; save(); closeSheet(); render(); toast(mode==='update' ? 'Riwayat diperbarui' : 'Tersimpan di riwayat');
}
function closeSheet(){ $('#sheetHost').innerHTML = ''; }

function toast(t){ const d = document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(), 2200); }
function touched(){ if (S.sample) { S.sample = false; const b = document.querySelector('.tile.yellow[data-act="sheet"]'); if (b) b.remove(); } save(); }
function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0,y); }

document.addEventListener('click', e => {
  const b = e.target.closest('button, a, .scrim'); if (!b) return;
  const d = b.dataset;
  if (d.act === 'close') { if (e.target === b || b.tagName === 'BUTTON') closeSheet(); return; }
  if (d.act === 'sheet') return openSheet();
  if (d.act === 'savesheet') { saveSheet(); setTimeout(() => { const j = $('#judul'); if (j) j.select(); }, 50); return; }
  if (d.act === 'save') return doSave(d.how);
  if (d.act === 'fit') { treeFit = !treeFit; return keepScroll(render); }
  if (d.act === 'tree-save') return saveTree(b);
  if (d.act === 'install') { if (!installEvt) return; installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; keepScroll(render); }); return; }
  if (d.act === 'ioshelp') { sheet('📲 Pasang di iPhone/iPad', `<ul class="notes"><li>Buka halaman ini di <b>Safari</b>.</li><li>Ketuk tombol <b>Bagikan</b> (kotak dengan panah ke atas) di bawah layar.</li><li>Pilih <b>Tambahkan ke Layar Utama</b>, lalu ketuk <b>Tambah</b>.</li><li>Ayam Waris muncul di layar utama dan bisa dibuka tanpa internet.</li></ul><button class="btn primary" type="button" data-act="close">Mengerti</button>`); return; }
  if (d.act === 'copylink') { try { navigator.clipboard.writeText(UNDUH_URL).then(() => toast('Tautan unduhan disalin'), () => toast(UNDUH_LABEL)); } catch(_) { toast(UNDUH_LABEL); } return; }
  if (d.act === 'copymail') { const ok = () => toast('Alamat email disalin'); try { navigator.clipboard.writeText(KONTAK_EMAIL).then(ok, () => toast(KONTAK_EMAIL)); } catch(_) { toast(KONTAK_EMAIL); } return; }
  if (d.act === 'tree-share') return shareTree(b);
  if (d.open) { const x = loadR().find(r => r.id === d.open); if (!x) return; S = {...fresh(), ...x.data, sample:false, rid:x.id}; save(); view = {tab:'hitung', step:4}; render(); window.scrollTo(0,0); return; }
  if (d.askdel) { const x = loadR().find(r => r.id === d.askdel); if (!x) return; sheet('🗑️ Hapus dari riwayat?', `<p class="hint">"${esc(x.judul)}" akan dihapus dari HP ini dan tidak bisa dikembalikan.</p><button class="btn danger" type="button" data-del="${esc(x.id)}">Hapus</button><button class="btn soft" type="button" data-act="close">Batal</button>`); return; }
  if (d.del) { saveR(loadR().filter(r => r.id !== d.del)); if (S.rid === d.del) { S.rid = null; save(); } closeSheet(); render(); toast('Dihapus dari riwayat'); return; }
  if (d.tab) { closeSheet(); return setTab(d.tab); }
  if (d.step) return setStep(+d.step);
  if (d.go) return setStep(+d.go);
  if (d.sex) { S.sex = d.sex; if (d.sex==='L') S.heirs.suami=0; else S.heirs.istri=0; touched(); return render(); }
  if (d.mode) { S.mode = d.mode; save(); return render(); }
  if (d.inc || d.dec) { const k = d.inc || d.dec; const h = Waris.HEIRS.find(x=>x.k===k); S.heirs[k] = Math.max(0, Math.min(h.max, (S.heirs[k]||0) + (d.inc?1:-1))); touched(); return keepScroll(render); }
  if (d.toggle) { S.heirs[d.toggle] = S.heirs[d.toggle] ? 0 : 1; touched(); return keepScroll(render); }
  if (d.contoh) { S = fromContoh(CONTOH[+d.contoh]); save(); view = {tab:'hitung', step:4}; render(); window.scrollTo(0,0); return; }
  if (d.act === 'reset') { S = fresh(); save(); closeSheet(); view = {tab:'hitung', step:1}; render(); window.scrollTo(0,0); toast('Siap menghitung dari awal'); return; }
  if (d.act === 'copy') {
    const {hb,res} = compute(); const txt = shareText(hb,res);
    const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Ringkasan disalin'); } catch(_) { toast('Gagal menyalin, coba tombol WhatsApp'); } ta.remove(); };
    try { navigator.clipboard.writeText(txt).then(() => toast('Ringkasan disalin'), fallback); } catch(_) { fallback(); }
  }
});
$('#modechip').addEventListener('click', e => { e.stopPropagation(); S.mode = S.mode==='khi' ? 'jumhur' : 'khi'; save(); render(); toast(S.mode==='khi' ? 'Memakai KHI Indonesia' : 'Memakai pendapat jumhur ulama'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'nama') { S.nama = t.value; touched(); return; }
  if (t.dataset.money) {
    const digits = t.value.replace(/\D/g,'').slice(0,15);
    const v = digits ? parseInt(digits,10) : 0;
    S.harta[t.dataset.money] = v;
    const pos = t.value.length - t.selectionStart;
    t.value = v ? v.toLocaleString('id-ID') : '';
    try { const p = Math.max(0, t.value.length - pos); t.setSelectionRange(p,p); } catch(_){}
    touched(); const box = $('#hartaSum'); if (box) box.innerHTML = hartaSummary();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'gonoGini' || t.id === 'wasiatSetuju') { S.harta[t.id] = t.checked; touched(); const box = $('#hartaSum'); if (box) box.innerHTML = hartaSummary(); }
});

render();
if (isWebApp() && 'serviceWorker' in navigator && location.protocol === 'https:' || (isWebApp() && 'serviceWorker' in navigator && location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing; if (!nw) return;
        nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('Versi baru Ayam Waris siap. Buka ulang aplikasi.'); });
      });
    }).catch(() => {});
  });
}
})();
